services:
  - type: web
    name: temple-crm-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: temple-crm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: temple-crm-db
    plan: free
