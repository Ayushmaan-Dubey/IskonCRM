services:
  - type: web
    name: temple-crm-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: temple-crm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FORCE_HTTPS
        value: true
      # Voice quick-add (LiveKit). Set the values in the Render dashboard.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

databases:
  - name: temple-crm-db
    plan: free
